name: Daily deploy

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK is empty. Create a Deploy Hook in Vercel (Project Settings, Git) and add its URL as a repository secret."
            exit 1
          fi
          curl --fail -X POST "$VERCEL_DEPLOY_HOOK"
