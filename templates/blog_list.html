{% extends "base.html" %}
{% block title %}Writeups | Enzo Hins{% endblock %}

{% block content %}
<section>
    <p class="prompt">$ ls writeups/</p>
    <h1>Writeups</h1>
    <p class="lede">Competition retrospectives: what I did, what went wrong, what I'm changing.</p>
    <div class="rows">
        {% for post in posts %}
        <div class="row">
            <span class="when">{{ post.date }}</span>
            <a href="{{ url_for('blog_post', filename=post.filename) }}"><strong>{{ post.title }}</strong></a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
