<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enzo Hins. CS and cybersecurity student at James Madison University: projects, competitions and writeups.">
    <title>{% block title %}Enzo Hins{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap bar">
            <a class="brand" href="{{ url_for('home') }}">enzo<span>@</span>hins</a>
            <nav>
                {% set ep = request.endpoint %}
                <a href="{{ url_for('about') }}" {% if ep == 'about' %}class="active"{% endif %}>about</a>
                <a href="{{ url_for('competitions') }}" {% if ep == 'competitions' %}class="active"{% endif %}>competitions</a>
                <a href="{{ url_for('projects') }}" {% if ep == 'projects' %}class="active"{% endif %}>projects</a>
                <a href="{{ url_for('blog') }}" {% if ep in ('blog','blog_post') %}class="active"{% endif %}>writeups</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="wrap site-footer">
        <span>Enzo Hins, JMU class of 2029</span>
        <span><a href="mailto:hinsem@dukes.jmu.edu">Contact</a> · <a href="https://github.com/SketchyRock" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/enzohins/" rel="noopener">LinkedIn</a> · <a href="mailto:hinsem@dukes.jmu.edu">Email</a></span>
    </footer>
</body>
</html>
